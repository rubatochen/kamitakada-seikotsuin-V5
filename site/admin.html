<body>
<main class="admin">
  <div id="login" class="panel login">
    <h1 data-i18n="adminTitle">预约管理</h1>
    <p>上高田整骨院</p>
    <input id="pw" type="password" data-i18n-placeholder="adminPassword" placeholder="管理员密码" autocomplete="current-password">
    <button class="primary" style="width:100%" onclick="login()" data-i18n="login">登录</button>
    <p id="err" class="muted"></p>
  </div>

  <div id="app" style="display:none">
    <div class="top">
      <div><h1 data-i18n="adminTitle">预约管理</h1><p class="muted">上高田整骨院</p></div>
      <div class="top-actions">
        <div class="lang-switch" role="group" aria-label="Language">
          <button id="langZh" type="button" onclick="setAdminLanguage('zh')">中文</button>
          <button id="langJa" type="button" onclick="setAdminLanguage('ja')">日本語</button>
        </div>
        <button class="secondary" type="button" onclick="logout()" data-i18n="logout">退出登录</button>
      </div>
    </div>

    <div class="panel">
      <div class="calendar" style="justify-content:space-between;">
        <div class="calendar-controls" style="display:flex;gap:10px;align-items:center;">
          <button class="secondary" type="button" onclick="change(-1)" data-i18n-aria-label="prevDay" aria-label="前の日">←</button>
          <input id="date" type="date" data-i18n-aria-label="reservationDate" aria-label="予約日">
          <button class="secondary" type="button" onclick="change(1)" data-i18n-aria-label="nextDay" aria-label="次の日">→</button>
        </div>
        <div class="extension-actions-inline">
          <button class="primary" type="button" onclick="extendToday(30)">＋30分</button>
          <button class="primary" type="button" onclick="extendToday(40)">＋40分</button>
          <button class="primary" type="button" onclick="extendToday(50)">＋50分</button>
          <button class="primary" type="button" onclick="extendToday(60)">＋60分</button>
          <button class="phone-reserve-btn" type="button" onclick="openPhoneModal()" data-i18n="manualReservation">＋ 手動予約</button>
        </div>
      </div>
    </div>

    <section class="panel">
      <div class="panel-heading-row">
        <div><h2 data-i18n="todaySchedule">今日の予定</h2><p class="muted" data-i18n="todayScheduleDesc">予約と予約停止時間を開始時刻順にまとめて表示します。</p></div>
        <div class="schedule-summary">
          <div class="schedule-summary-item">
            <div class="schedule-summary-label" data-i18n="reservationCount">予約人数</div>
            <div class="schedule-summary-value"><span id="reservationCount">0</span><span class="schedule-summary-unit" data-i18n="peopleUnit">名</span></div>
          </div>
          <div class="schedule-summary-item">
            <div class="schedule-summary-label" data-i18n="reservationTotalTime">予約総時間</div>
            <div class="schedule-summary-value"><span id="reservationTotalHours">0</span><span class="schedule-summary-unit" data-i18n="hoursUnit">時間</span><span id="reservationTotalMinutes"></span></div>
          </div>
        </div>
      </div>
      <div id="schedule" class="schedule-list"></div>
    </section>

    <div class="grid3 secondary-tools">
      <section class="panel compact-panel">
        <h2 data-i18n="temporaryBreak">临时休息</h2>
        <div class="break-controls">
          <div class="break-range">
            <div class="break-time-row"><label data-i18n="startTime">开始</label><input id="bs" type="time" value="12:00" aria-label="開始時間"></div>
            <div class="break-time-row"><label data-i18n="endTime">结束</label><input id="be" type="time" value="14:00" aria-label="終了時間"></div>
          </div>
          <button class="primary" type="button" onclick="addBreak()" data-i18n="addBreak">添加休息时间</button>
        </div>
        <div id="breaks" style="margin-top:12px"></div>
      </section>
      <section class="panel compact-panel">
        <h2 data-i18n="holiday">休诊日</h2>
        <div class="compact-controls">
          <input id="holidayDate" type="date" data-i18n-aria-label="date">
          <button class="primary" type="button" onclick="addHoliday()" data-i18n="setHoliday">设为休诊</button>
        </div>
        <div id="holidays" style="margin-top:12px"></div>
      </section>
      <section class="panel compact-panel pause-panel">
        <h2 data-i18n="pauseClinic">暂停营业</h2>
        <p class="muted" data-i18n="pauseHint">暂停后前台将显示预计开业日期，并停止新的预约。</p>
        <div id="pauseState" class="pause-state" style="display:none"></div>
        <div id="pauseDirectControls" class="pause-direct-controls">
          <label for="pauseReopeningDate" data-i18n="reopeningDate">预计开业日期</label>
          <input id="pauseReopeningDate" type="date">
          <div class="pause-actions">
            <button id="pauseButton" class="pause-btn" type="button" onclick="pauseClinic()" data-i18n="pauseClinic">暂停营业</button>
            <button id="resumeButton" class="pause-btn resume" type="button" onclick="resumeClinic()" data-i18n="resumeClinic">取消暂停营业</button>
          </div>
        </div>
      </section>
    </div>

    <section class="panel">
      <h2 data-i18n="businessHours">营业时间</h2>
      <p class="muted" data-i18n="businessHoursDesc">设置每周营业时间和预约间隔。</p>
      <div id="hours"></div>
      <button class="primary" type="button" onclick="saveHours()" data-i18n="saveBusinessHours">保存营业时间</button>
    </section>
  </div>

  <div id="phoneReserveModal" class="phone-modal">
    <div class="phone-modal-box">
      <div style="display:flex;justify-content:space-between;align-items:center"><h2 id="phoneReserveModalTitle">手動予約を登録</h2><button class="danger" type="button" onclick="closePhoneModal()" data-i18n-aria-label="close">×</button></div>
      <div style="margin-top:20px">
        <div class="phone-field"><label data-i18n="reservationDateLabel">预约日</label><input id="phoneReserveDate" type="date"></div>
        <div class="phone-field"><label data-i18n="reservationTimeLabel">预约时间</label><input id="phoneReserveTime" type="time"></div>
        <div class="phone-field"><label data-i18n="extensionTreatment">延长施术</label><select id="phoneReserveExtension"><option value="0" data-i18n="extension0">なし（25分施術 / 30分確保）</option><option value="10" data-i18n="extension10">10分延長（35分施術 / 40分確保）＋800円</option><option value="20" data-i18n="extension20">20分延長（45分施術 / 50分確保）＋1,600円</option><option value="30" data-i18n="extension30">30分延長（55分施術 / 60分確保）＋2,400円</option></select></div>
        <div class="phone-field"><label data-i18n="name">姓名</label><input id="phoneReserveName" type="text" maxlength="80" data-i18n-placeholder="patientName" placeholder="患者姓名"></div>
        <div class="phone-field"><label data-i18n="phoneNumber">电话号码</label><input id="phoneReservePhone" type="tel" maxlength="40" data-i18n-placeholder="phoneNumberPlaceholder" placeholder="电话号码"></div>
        <div class="phone-field"><label data-i18n="notes">备注</label><textarea id="phoneReserveNote" rows="3" maxlength="500" data-i18n-placeholder="notesPlaceholder" placeholder="备注（任意）"></textarea></div>
        <p id="phoneReserveError" class="phone-error"></p>
        <div class="phone-modal-actions"><button class="secondary" type="button" onclick="closePhoneModal()" data-i18n="cancel">取消</button><button class="primary" type="button" onclick="submitPhoneReservation()" id="phoneReserveSubmit" data-i18n="registerManual">手动预约を登録</button></div>
      </div>
    </div>
  </div>
</main>

      notFound:'予約が見つかりません。画面を更新してください。', notEditable:'キャンセル済みの予約は変更できません。', invalidExtension:'延長時間が正しくありません。', alreadyBooked:'この時間はすでに予約されています。', pastTime:'過去の時間は予約できません。', breakTime:'休憩時間のため予約できません。', unavailable:'この時間は予約できません。', invalidDate:'予約日が正しくありません。', invalidTime:'予約時間が正しくありません。', invalidName:'お名前を入力してください。', invalidPhone:'電話番号を入力してください。', sessionExpired:'ログインセッションが切れています。', editFailed:'予約の変更に失敗しました。', manualFailed:'手動予約の登録に失敗しました。',
      manualRegistered:'手動予約を登録しました。', reservationUpdated:'予約を変更しました。', reservationCancelled:'予約をキャンセルしました。', reservationDeleted:'予約を削除しました。', breakAdded:'休憩時間を追加しました。', breakDeleted:'休憩時間を削除しました。', holidayAdded:'休診日に設定しました。', holidayRemoved:'休診日を解除しました。', businessHoursSaved:'営業時間を保存しました。',
      weekdays:['日','月','火','水','木','金','土']
    }
  };

  function t(key, ...args){ const value = I18N[adminLanguage][key]; return typeof value === 'function' ? value(...args) : (value ?? key); }

  function applyAdminLanguage(){
    document.documentElement.lang = adminLanguage === 'zh' ? 'zh-CN' : 'ja';
    document.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = t(el.dataset.i18n); });
    document.querySelectorAll('[data-i18n-placeholder]').forEach(el => { el.placeholder = t(el.dataset.i18nPlaceholder); });
    document.querySelectorAll('[data-i18n-aria-label]').forEach(el => { el.setAttribute('aria-label', t(el.dataset.i18nAriaLabel)); });
    document.getElementById('langZh').classList.toggle('active', adminLanguage === 'zh');
    document.getElementById('langJa').classList.toggle('active', adminLanguage === 'ja');
    renderPauseState();
    document.title = `${t('adminTitle')} | 上高田整骨院`;
    if (D) { renderSchedule(); renderBreaks(); renderHolidays(); renderHours(); }
    if (phoneModalMode === 'edit') { document.getElementById('phoneReserveModalTitle').textContent = t('edit'); document.getElementById('phoneReserveSubmit').textContent = t('saveChanges'); }
    else { document.getElementById('phoneReserveModalTitle').textContent = t('registerManual'); document.getElementById('phoneReserveSubmit').textContent = t('registerManual'); }
  }

  function setAdminLanguage(lang){ adminLanguage = lang === 'zh' ? 'zh' : 'ja'; localStorage.setItem('kamitakada-admin-language', adminLanguage); applyAdminLanguage(); }

  const days = I18N.ja.weekdays;

  function today(){ const d=new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }
  function change(n){
    const dateInput=document.getElementById('date');
    if(!dateInput.value) dateInput.value=today();
    const parts=dateInput.value.split('-').map(Number);
    const d=new Date(parts[0],parts[1]-1,parts[2]);
    d.setDate(d.getDate()+n);
    const y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,'0'),day=String(d.getDate()).padStart(2,'0');
    dateInput.value=`${y}-${m}-${day}`;
    render().catch(handleAdminLoadError);
  }
  async function api(path,opt={}){ const r=await fetch(path,{...opt,credentials:'same-origin'}); const j=await r.json().catch(()=>({error:'error'})); if(!r.ok){const error=new Error(j.error||'error');error.code=j.code;error.status=r.status;throw error;}return j; }
  function loginErrorMessage(e){ if(e.code==='admin_password_not_configured')return t('loginPasswordNotConfigured'); if(e.code==='session_creation_failed')return t('sessionCreationFailed'); if(e.code==='invalid_password')return t('invalidPassword'); return t('loginFailed'); }
  async function login(){ const errorBox=document.getElementById('err'); const passwordInput=document.getElementById('pw'); errorBox.textContent=''; try{await api('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:passwordInput.value})});}catch(e){errorBox.textContent=loginErrorMessage(e);return;} passwordInput.value=''; showApp(); }
  function showApp(){document.getElementById('login').style.display='none';document.getElementById('app').style.display='block';document.getElementById('date').value=today();document.getElementById('holidayDate').value=today();applyAdminLanguage();render().catch(handleAdminLoadError);}
  function showLogin(){document.getElementById('login').style.display='block';document.getElementById('app').style.display='none';}
  function handleAdminLoadError(e){const errorBox=document.getElementById('err'); if(e.status===401||e.status===403)errorBox.textContent=t('sessionInvalid');else if(e.status>=500)errorBox.textContent=t('dataLoadFailed');else errorBox.textContent=t('dataGetFailed');showLogin();}
  async function render(){D=await api('/api/admin/data');renderSchedule();renderBreaks();renderHolidays();renderHours();}

  function renderSchedule(){
    const box=document.getElementById('schedule');const selectedDate=document.getElementById('date').value;const items=[];
    const appointments=D.appointments.filter(x=>x.date===selectedDate&&x.status!=='cancelled');
    const reservationCount=appointments.length;
    const totalTreatmentMinutes=appointments.reduce((sum,x)=>{
      const occupied=Number(x.duration_minutes)||30;
      return sum + Math.max(25,occupied-5);
    },0);
    document.getElementById('reservationCount').textContent=reservationCount;
    document.getElementById('reservationTotalHours').textContent=Math.floor(totalTreatmentMinutes/60);
    document.getElementById('reservationTotalMinutes').textContent=totalTreatmentMinutes%60 ? ` ${totalTreatmentMinutes%60}${t('minutesUnit')}` : '';
    D.appointments.filter(x=>x.date===selectedDate).sort((a,b)=>a.time.localeCompare(b.time)).forEach(x=>{const occupied=Number(x.duration_minutes)||30;const treatment=Math.max(25,occupied-5);items.push({start:toMinutes(x.time),end:toMinutes(x.time)+occupied,type:'appointment',time:x.time,name:esc(x.name),detail:occupied===30?t('basicTreatment'):t('treatmentHold',treatment,occupied),contact:`${esc(x.phone)}${x.note?' · '+esc(x.note):''}`,action:x.status==='cancelled'?`<button class="danger" type="button" onclick="cancelA('${x.id}')">${t('delete')}</button>`:`<div class="schedule-actions"><button class="secondary" type="button" onclick="openEditModal('${x.id}')">${t('edit')}</button><button class="danger" type="button" onclick="cancelA('${x.id}')">${t('cancel')}</button></div>`});});
    D.breaks.filter(x=>x.date===selectedDate).forEach(x=>items.push({start:toMinutes(x.startTime),end:toMinutes(x.endTime),type:'stop',time:`${x.startTime} ～ ${x.endTime}`,name:t('stop'),detail:t('stopDetail'),contact:'',action:`<button class="danger" type="button" onclick="delBreak('${x.id}')">${t('delete')}</button>`}));
    items.sort((a,b)=>a.start-b.start||a.end-b.end);box.innerHTML=items.length?items.map(x=>`<div class="schedule-row"><div class="schedule-time">${x.time}</div><div><div><span class="schedule-tag ${x.type==='stop'?'stop':''}">${x.type==='stop'?t('stop'):t('appointment')}</span><strong>${x.name}</strong></div><div class="muted">${x.detail}</div>${x.contact?`<div class="muted">${x.contact}</div>`:''}</div><div>${x.action}</div></div>`).join(''):`<p class="muted">${t('noSchedule')}</p>`;
  }
  function renderBreaks(){const list=D.breaks.filter(x=>x.date===today()).slice().sort((a,b)=>a.startTime.localeCompare(b.startTime));document.getElementById('breaks').innerHTML=list.length?list.map(x=>`<div style="padding:7px 0">${x.date} ${x.startTime}–${x.endTime} <button class="danger" type="button" onclick="delBreak('${x.id}')">${t('delete')}</button></div>`).join(''):`<p class="muted">${t('noItems')}</p>`;}
  function toMinutes(value){const parts=String(value).split(':').map(Number);return parts[0]*60+parts[1];}
  async function extendToday(minutes){const todayValue=today();if(document.getElementById('date').value!==todayValue){document.getElementById('date').value=todayValue;await render();}try{await api('/api/admin/extend',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({date:todayValue,minutes})});await render();alert(t('extendSuccess',minutes));}catch(e){alert(e.message||t('extendFailed'));}}
  function renderHolidays(){const list=D.holidays.slice().sort();document.getElementById('holidays').innerHTML=list.length?list.map(x=>`<div style="padding:7px 0">${x} <button class="danger" type="button" onclick="delHoliday('${x}')">${t('delete')}</button></div>`).join(''):`<p class="muted">${t('noItems')}</p>`;}
  function renderHours(){const weekdayNames=I18N[adminLanguage].weekdays;document.getElementById('hours').innerHTML='<table><tr><th>'+ (adminLanguage==='zh'?'星期':'曜日') +'</th><th>'+ (adminLanguage==='zh'?'营业':'営業') +'</th><th>'+ (adminLanguage==='zh'?'开始':'開始') +'</th><th>'+ (adminLanguage==='zh'?'结束':'終了') +'</th></tr>'+weekdayNames.map((n,i)=>{const v=D.businessHours[i];return `<tr><td>${n}</td><td><input type="checkbox" id="e${i}" ${v?'checked':''}></td><td><input id="s${i}" type="time" value="${v?v[0]:'10:00'}"></td><td><input id="t${i}" type="time" value="${v?v[1]:'19:00'}"></td></tr>`;}).join('')+'</table><p class="muted">'+(adminLanguage==='zh'?'基本施术：25分钟・系统占用：30分钟。延长10/20/30分钟分别占用40/50/60分钟。开始时间可按1分钟选择。':'基本施術：25分・システム確保：30分。延長10/20/30分はそれぞれ40/50/60分を確保します。開始時間は1分単位で選択できます。')+'</p>';}

  async function cancelA(id){const a=D.appointments.find(x=>x.id===id);if(!a)return;await api('/api/admin/'+(a.status==='cancelled'?'delete':'cancel'),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id})});await render();alert(a.status==='cancelled'?t('reservationDeleted'):t('reservationCancelled'));}
  async function addBreak(){await api('/api/admin/breaks',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({start:document.getElementById('bs').value,end:document.getElementById('be').value})});await render();alert(t('breakAdded'));}
  async function delBreak(id){await api('/api/admin/breaks-delete',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id})});await render();alert(t('breakDeleted'));}
  async function addHoliday(){await api('/api/admin/holiday',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({date:document.getElementById('holidayDate').value})});await render();alert(t('holidayAdded'));}
  async function delHoliday(dateValue){await api('/api/admin/holiday-delete',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({date:dateValue})});await render();alert(t('holidayRemoved'));}
  function pauseTodayKey(){
    const now=new Date();
    const parts=new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Tokyo',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(now);
    const v=Object.fromEntries(parts.filter(x=>x.type!=='literal').map(x=>[x.type,x.value]));
    return `${v.year}-${v.month}-${v.day}`;
  }
  function isPauseActive(){return !!(D&&D.temporaryPauseUntil&&D.temporaryPauseUntil>pauseTodayKey());}
  function renderPauseState(){
    const pauseButton=document.getElementById('pauseButton');
    const resumeButton=document.getElementById('resumeButton');
    const state=document.getElementById('pauseState');
    const input=document.getElementById('pauseReopeningDate');
    if(!pauseButton||!resumeButton||!state||!input)return;
    const active=isPauseActive();
    pauseButton.disabled=active;
    resumeButton.disabled=!active;
    state.style.display=active?'block':'none';
    state.innerHTML=active?`<strong>${t('pauseActive')}</strong>${t('pausedUntil')}: ${formatAdminDate(D.temporaryPauseUntil)}`:'';
    input.value=active?(D.temporaryPauseUntil||''):'';
    input.disabled=active;
  }
  function formatAdminDate(value){return value?String(value).replaceAll('-','/') : '';}
  async function pauseClinic(){
    const value=document.getElementById('pauseReopeningDate').value;
    if(!value||value<=pauseTodayKey()){alert(t('pauseInvalid'));return;}
    try{
      await api('/api/admin/pause',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'pause',reopeningDate:value})});
      await render();
    }catch(e){alert(t('pauseFailed'));}
  }
  async function resumeClinic(){
    if(!confirm(adminLanguage==='ja'?'臨時休業を解除しますか？':'确定取消暂停营业吗？'))return;
    try{await api('/api/admin/pause',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'resume'})});await render();}
    catch(e){alert(t('resumeFailed'));}
  }

  async function saveHours(){const h={};for(let i=0;i<7;i++)h[i]=document.getElementById('e'+i).checked?[document.getElementById('s'+i).value,document.getElementById('t'+i).value]:null;await api('/api/admin/hours',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({businessHours:h,slotMinutes:30})});alert(t('businessHoursSaved'));await render();}
  async function logout(){await fetch('/api/logout',{method:'POST',credentials:'same-origin'});showLogin();}
  function esc(s){return String(s).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));}

  function openPhoneModal(){phoneModalMode='create';editingAppointmentId=null;document.getElementById('phoneReserveModalTitle').textContent=t('registerManual');document.getElementById('phoneReserveSubmit').textContent=t('registerManual');document.getElementById('phoneReserveDate').value=document.getElementById('date').value||today();document.getElementById('phoneReserveTime').value='';document.getElementById('phoneReserveName').value='';document.getElementById('phoneReserveExtension').value='0';document.getElementById('phoneReservePhone').value='';document.getElementById('phoneReserveNote').value='';document.getElementById('phoneReserveError').textContent='';document.getElementById('phoneReserveModal').classList.add('open');document.getElementById('phoneReserveName').focus();}
  function openEditModal(id){const a=D&&D.appointments?D.appointments.find(x=>String(x.id)===String(id)):null;if(!a||a.status==='cancelled')return;phoneModalMode='edit';editingAppointmentId=a.id;document.getElementById('phoneReserveModalTitle').textContent=t('edit');document.getElementById('phoneReserveSubmit').textContent=t('saveChanges');document.getElementById('phoneReserveDate').value=a.date||'';document.getElementById('phoneReserveTime').value=a.time||'';document.getElementById('phoneReserveName').value=a.name||'';document.getElementById('phoneReservePhone').value=a.phone||'';const occupied=Number(a.duration_minutes)||30;const extension=Math.max(0,occupied-30);document.getElementById('phoneReserveExtension').value=[0,10,20,30].includes(extension)?String(extension):'0';let note=a.note||'';if(note.startsWith('電話受付'))note=note.replace(/^電話受付(?:\s*·\s*)?/,'');document.getElementById('phoneReserveNote').value=note;document.getElementById('phoneReserveError').textContent='';document.getElementById('phoneReserveModal').classList.add('open');document.getElementById('phoneReserveName').focus();}
  function closePhoneModal(){document.getElementById('phoneReserveModal').classList.remove('open');}

  async function submitPhoneReservation(){
    const dateValue=document.getElementById('phoneReserveDate').value,timeValue=document.getElementById('phoneReserveTime').value,nameValue=document.getElementById('phoneReserveName').value.trim(),extensionValue=Number(document.getElementById('phoneReserveExtension').value||0),phoneValue=document.getElementById('phoneReservePhone').value.trim(),noteValue=document.getElementById('phoneReserveNote').value.trim(),errorBox=document.getElementById('phoneReserveError');errorBox.textContent='';
    if(!dateValue){errorBox.textContent=t('invalidDate');return;} if(!timeValue){errorBox.textContent=t('invalidTime');return;} if(!nameValue){errorBox.textContent=t('invalidName');return;} if(!phoneValue){errorBox.textContent=t('invalidPhone');return;}
    try{const endpoint=phoneModalMode==='edit'?'/api/admin/update':'/api/admin/reserve';const payload={date:dateValue,time:timeValue,name:nameValue,phone:phoneValue,note:noteValue,extensionMinutes:extensionValue};if(phoneModalMode==='edit')payload.id=editingAppointmentId;await api(endpoint,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});closePhoneModal();document.getElementById('date').value=dateValue;await render();alert(phoneModalMode==='edit'?t('reservationUpdated'):t('manualRegistered'));}
    catch(e){if(e.code==='not_found')errorBox.textContent=t('notFound');else if(e.code==='not_editable')errorBox.textContent=t('notEditable');else if(e.code==='invalid_extension')errorBox.textContent=t('invalidExtension');else if(e.code==='already_booked')errorBox.textContent=t('alreadyBooked');else if(e.code==='past_time')errorBox.textContent=t('pastTime');else if(e.code==='break_time')errorBox.textContent=t('breakTime');else if(e.code==='unavailable')errorBox.textContent=t('unavailable');else if(e.code==='invalid_date')errorBox.textContent=t('invalidDate');else if(e.code==='invalid_time')errorBox.textContent=t('invalidTime');else if(e.code==='invalid_name')errorBox.textContent=t('invalidName');else if(e.code==='invalid_phone')errorBox.textContent=t('invalidPhone');else if(e.status===401||e.status===403)errorBox.textContent=t('sessionExpired');else errorBox.textContent=phoneModalMode==='edit'?t('editFailed'):t('manualFailed');}
  }

  document.getElementById('phoneReserveModal').addEventListener('click',function(e){if(e.target===this)closePhoneModal();});
  document.getElementById('date').addEventListener('change',function(){render().catch(handleAdminLoadError);});
  document.getElementById('pw').addEventListener('keydown',function(e){if(e.key==='Enter')login();});
  applyAdminLanguage();
  (async function(){try{await api('/api/admin/data');showApp();}catch(e){showLogin();}})();
</script>
</body>
</html>
